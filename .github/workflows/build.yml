name: Build Ryzix-OreESP Fabric Mod
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ryzix-OreESP-v1-0-${{ github.run_number }}
          path: build/libs/ryzix-oreesp-v1-0-${{ github.run_number }}.jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1-0-${{ github.run_number }}
          name: Ryzix-OreESP v1-0-${{ github.run_number }}
          files: build/libs/ryzix-oreesp-v1-0-${{ github.run_number }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
